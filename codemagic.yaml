# codemagic.yaml
# ─────────────────────────────────────────────────────────────────────────────
# LoyversePOS — Codemagic CI/CD Configuration
#
# HOW TO USE:
#   1. Push this repo to GitHub / GitLab / Bitbucket.
#   2. Connect the repo on https://codemagic.io
#   3. Set the required Environment Variables in Codemagic UI:
#
#   ANDROID SIGNING (required for release APK/AAB):
#     CM_KEYSTORE           — Base64-encoded .jks keystore file
#     CM_KEYSTORE_PASSWORD  — Keystore password
#     CM_KEY_ALIAS          — Key alias
#     CM_KEY_PASSWORD       — Key password
#
#   FIREBASE (required for the app to connect to your project):
#     GOOGLE_SERVICES_JSON  — Base64-encoded google-services.json (Android)
#     FIREBASE_OPTIONS_DART — (Optional) auto-generated firebase_options.dart content
#
#   NOTIFICATIONS (optional):
#     SLACK_WEBHOOK_URL     — Slack webhook for build notifications
#
# ─────────────────────────────────────────────────────────────────────────────

definitions:
  # Shared Flutter environment
  flutter_env: &flutter_env
    flutter: stable
    xcode: latest          # macOS agents only (not needed here, but kept for reference)
    cocoapods: default

  # Reusable environment variables
  base_env: &base_env
    FLUTTER_VERSION: stable
    PACKAGE_NAME: "com.loyversepos.app"

  # Reusable cache configuration
  cache_config: &cache_config
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/.dart_tool

workflows:

  # ───────────────────────────────────────────────────────────────────────────
  # WORKFLOW 1: Android Debug APK (fast, no signing needed)
  # ───────────────────────────────────────────────────────────────────────────
  android-debug:
    name: "Android — Debug APK"
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      vars:
        <<: *base_env
        BUILD_NAME: "debug"
      <<: *cache_config

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true
        - pattern: "feature/*"
          include: true

    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter pub get

      - name: Inject google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json injected successfully"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON not set. Using placeholder firebase_options.dart"
          fi

      - name: Run code generation (Hive adapters)
        script: |
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Analyse code
        script: flutter analyze --no-fatal-infos || true

      - name: Build Debug APK
        script: |
          flutter build apk --debug \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      slack:
        channel: "#builds"
        notify_on_build_start: false
        notify:
          success: true
          failure: true

  # ───────────────────────────────────────────────────────────────────────────
  # WORKFLOW 2: Android Release APK + AAB (signed, production-ready)
  # ───────────────────────────────────────────────────────────────────────────
  android-release:
    name: "Android — Release APK + AAB (Signed)"
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      android_signing:
        - loyverse_keystore          # Name of keystore added in Codemagic UI
      vars:
        <<: *base_env
        BUILD_NAME: "release"
      <<: *cache_config

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter pub get

      - name: Inject google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Set up signing keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/loyverse.jks
          cat >> android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/loyverse.jks
          EOF

      - name: Update app/build.gradle for signing
        script: |
          # Append signing config if not already present
          if ! grep -q "signingConfigs" android/app/build.gradle; then
            cat >> android/app/build.gradle << 'GRADLE'

          // Injected by Codemagic CI
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          fi

      - name: Run code generation
        script: dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Release APK
        script: |
          flutter build apk --release \
            --build-name=$PROJECT_BUILD_VERSION \
            --build-number=$BUILD_NUMBER \
            --shrink \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Build App Bundle (AAB)
        script: |
          flutter build appbundle --release \
            --build-name=$PROJECT_BUILD_VERSION \
            --build-number=$BUILD_NUMBER \
            --obfuscate \
            --split-debug-info=build/debug-info

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/debug-info/

    publishing:
      google_play:
        credentials: $GPLAY_SERVICE_ACCOUNT_JSON   # Add in Codemagic env vars
        track: internal
        submit_as_draft: true
      slack:
        channel: "#releases"
        notify_on_build_start: true
        notify:
          success: true
          failure: true

  # ───────────────────────────────────────────────────────────────────────────
  # WORKFLOW 3: Windows Desktop Build (EXE installer)
  # ───────────────────────────────────────────────────────────────────────────
  windows-release:
    name: "Windows — Desktop EXE"
    max_build_duration: 60
    instance_type: windows_x2   # Codemagic Windows agent

    environment:
      flutter: stable
      vars:
        <<: *base_env

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: Set up Flutter
        script: |
          flutter --version
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Inject Firebase options (Windows)
        script: |
          # If you store firebase_options.dart as a secret, inject it here
          # Otherwise the placeholder file in the repo is used.
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Run code generation
        script: dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Windows Release
        script: |
          flutter build windows --release \
            --build-name=$PROJECT_BUILD_VERSION \
            --build-number=$BUILD_NUMBER

      - name: Create MSIX installer (optional — requires msix package)
        script: |
          if flutter pub deps | grep -q msix; then
            dart run msix:create
          else
            echo "msix package not found, skipping installer creation"
          fi

      - name: Zip Windows build
        script: |
          cd build/windows/x64/runner/Release
          powershell Compress-Archive -Path . -DestinationPath $CM_BUILD_DIR/LoyversePOS-Windows-$BUILD_NUMBER.zip

    artifacts:
      - build/windows/x64/runner/Release/**
      - "*.zip"
      - build/windows/x64/runner/Release/*.msix

    publishing:
      slack:
        channel: "#releases"
        notify_on_build_start: false
        notify:
          success: true
          failure: true

  # ───────────────────────────────────────────────────────────────────────────
  # WORKFLOW 4: Full Multi-Platform (Android + Windows in one trigger)
  # ───────────────────────────────────────────────────────────────────────────
  multi-platform-release:
    name: "Multi-Platform — Android AAB + Windows EXE"
    max_build_duration: 90
    instance_type: mac_mini_m2   # Android build; Windows is separate pipeline

    environment:
      flutter: stable
      vars:
        <<: *base_env
      <<: *cache_config

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "release/*"
          include: true

    scripts:
      - name: Flutter setup
        script: |
          flutter --version
          flutter pub get

      - name: Inject secrets
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json

      - name: Code generation
        script: dart run build_runner build --delete-conflicting-outputs || true

      - name: Tests
        script: flutter test --coverage || true

      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --build-name=$PROJECT_BUILD_VERSION \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - coverage/

    publishing:
      slack:
        channel: "#releases"
        notify:
          success: true
          failure: true
